# spring.application.name=MushroomToxinDB

# =============================================================
# \u57FA\u672C\u914D\u7F6E
# =============================================================
spring.application.name=MushroomToxinDB
server.port=8080

# =============================================================
# \u6570\u636E\u6E90\u914D\u7F6E (MySQL 5.6)
# =============================================================
# \u7531\u4E8EMySQL 5.6 \u6CA1\u6709com.mysql.cj.jdbc.Driver\uFF0C\u6240\u4EE5\u7528\u8FD9\u4E2A
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
# replace 'localhost:3306' with your host and 'mushroom_toxin_db' with your db name
# useSSL=false \u56E0\u4E3A 5.6 \u9ED8\u8BA4\u4E0D\u652F\u6301 SSL\uFF0CserverTimezone \u8BBE\u7F6E\u65F6\u533A
spring.datasource.url=jdbc:mysql://yoursql_db_url
spring.datasource.username=yourusername
spring.datasource.password=yourpassword

# =============================================================
# MyBatis-Plus \u914D\u7F6E
# =============================================================
# \u81EA\u52A8\u5C06\u6570\u636E\u5E93\u4E2D\u7684\u4E0B\u5212\u7EBF\u547D\u540D\uFF08\u5982 CAS_Number\uFF09\u6620\u5C04\u5230 Java \u7684\u9A7C\u5CF0\u547D\u540D\uFF08\u5982 casNumber\uFF09
mybatis-plus.configuration.map-underscore-to-camel-case=true
# \u6253\u5370\u6267\u884C\u7684 SQL \u8BED\u53E5\uFF08\u8C03\u8BD5\u65F6\u5F00\u542F\uFF0C\u751F\u4EA7\u73AF\u5883\u5EFA\u8BAE\u5173\u95ED\uFF09
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# \u903B\u8F91\u5220\u9664\u914D\u7F6E\uFF08\u5982\u679C\u8868\u4E2D\u6709 @TableLogic \u6CE8\u89E3\u7684\u5B57\u6BB5\uFF09
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
# \u8BBE\u7F6E MyBatis Plus \u7684\u4E3B\u952E\u751F\u6210\u7B56\u7565
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.configuration.cache-enabled=false

# =============================================================
# \u5173\u952E\u914D\u7F6E\uFF1A\u542F\u7528\u81EA\u52A8\u7ED3\u679C\u6620\u5C04\u548C\u7C7B\u578B\u5904\u7406\u5668
# =============================================================
# \u542F\u7528\u81EA\u52A8\u7ED3\u679C\u6620\u5C04\uFF0C\u652F\u6301 @TableField(typeHandler = ...)
mybatis-plus.configuration.auto-mapping-behavior=full
# \u8BBE\u7F6E\u9ED8\u8BA4\u7684\u679A\u4E3E\u7C7B\u578B\u5904\u7406\u5668
mybatis-plus.configuration.default-enum-type-handler=com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler

# =============================================================
# \u7C7B\u578B\u5904\u7406\u5668\u5305\u626B\u63CF\u914D\u7F6E\uFF08\u5982\u679C\u4F7F\u7528\u81EA\u5B9A\u4E49\u7C7B\u578B\u5904\u7406\u5668\uFF09
# =============================================================
# \u66FF\u6362\u4E3A\u4F60\u7684\u5B9E\u9645\u5305\u8DEF\u5F84
# mybatis-plus.type-handlers-package=com.yy.mushroomtoxindb.handler

# =============================================================
# \u8FDE\u63A5\u6C60\u914D\u7F6E
# =============================================================
# \u8BBE\u7F6E HikariCP \u8FDE\u63A5\u6C60
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# =============================================================
# \u9759\u6001\u8D44\u6E90 (\u56FE\u7247\u8BBF\u95EE\u8DEF\u5F84)
# =============================================================
# \u53EF\u4EE5\u901A\u8FC7 http://localhost:8080/images/xxx.png \u8BBF\u95EE
spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=3600
spring.web.resources.chain.cache=true

# \u9632\u6B62 Vue Router 404
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# =============================================================
# JSON \u914D\u7F6E
# =============================================================
# \u7EDF\u4E00\u683C\u5F0F\u5316\u8FD4\u56DE\u7684 JSON \u4E2D Date \u7C7B\u578B\uFF08\u5982 SubmitTime \u5B57\u6BB5\uFF09
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
# \u914D\u7F6E Jackson \u5BF9 null \u503C\u7684\u5904\u7406
spring.jackson.default-property-inclusion=non_null
# \u914D\u7F6E Jackson \u5E8F\u5217\u5316\u65F6\u5305\u542B\u7684\u7C7B\u578B\u4FE1\u606F\uFF08\u5982\u679C\u9700\u8981\uFF09
# spring.jackson.mapper.default-view-inclusion=true

# =============================================================
# Spring MVC \u914D\u7F6E
# =============================================================
# \u8BBE\u7F6E\u6587\u4EF6\u4E0A\u4F20\u5927\u5C0F\u9650\u5236
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# =============================================================
# \u5E94\u7528\u65E5\u5FD7\u914D\u7F6E
# =============================================================
logging.level.com.yy.mushroomtoxindb=debug
logging.level.org.springframework=info
logging.level.com.baomidou.mybatisplus=info

#\u8BF4\u660E\u6587\u6863\u751F\u6210
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs